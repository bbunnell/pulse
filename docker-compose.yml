services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: timeboard
      POSTGRES_PASSWORD: timeboard
      POSTGRES_DB: timeboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeboard -d timeboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://timeboard:timeboard@db:5432/timeboard
      SESSION_SECRET: ${SESSION_SECRET:-change-me-use-long-random-secret}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
